name: poker

services:
  app:
    build: .
    environment:
      - TZ=Europe/Berlin
    ports:
      # Nur intern auf dem Pi erreichbar (127.0.0.1:8097) - ein bereits
      # laufender Reverse Proxy auf dem Pi kann eine Subdomain (z.B.
      # poker.oualid.de) hierher routen, analog zu wizard.oualid.de -> 8093.
      # Port 8097 gewählt, weil 8080/8081/8090/8091/8092/8093/8443 schon von
      # anderen Projekten (FinanceAgent, Monitoring Shop, Widerstand, Wizard)
      # belegt sind, und 8094/8095/8096 vom Spielehub selbst sowie von Bluff
      # und Tempel des Schreckens belegt sind.
      - "127.0.0.1:8097:3000"
    restart: unless-stopped
